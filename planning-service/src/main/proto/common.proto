syntax = "proto3";

package common_proto;

option go_package = "api-service/grpc/pb/common";
option java_package = "com.example.planning.grpc";
option java_multiple_files = true;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}
message HelloReply {
  string message = 1;
}
