spring.application.name=planning-service
server.port=8081

# -- API Service gRPC Endpoint (internal Docker service name) --
api.service.host=api-service
api.service.port=50051

# -- Social Media Service URL (use service name, not localhost) --
social-media-service.url=http://social-media-service:8080
social-media-service.trip-history-path=/api/trips/history/

# -- Gemini Service URL (called through Kong or direct IP) --
gemini.service.url=http://api-service:8000/gemini

