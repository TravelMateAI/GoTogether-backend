logging.level.org.springframework.web.cors=INFO
logging.level.org.springframework.security=INFO # Set to DEBUG for troubleshooting OAuth2/Keycloak
logging.level.com.example.Authservice=INFO # Corrected package name

# Spring Security OAuth2 Client Configuration
# Provider details for Keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:https://gotogetheruom.duckdns.org:8446/realms/kong}

# Keycloak Issuer URI for JWT validation (if Authservice itself validates tokens for its gRPC services)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://gotogetheruom.duckdns.org:8446/realms/kong}
# spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username # Default is 'sub'

# Client registration details for this application (auth-service) registered in Keycloak
# The registration ID "keycloak-client" is used here, but the properties had "google" which was confusing.
# Let's assume the actual client registration in Keycloak for this app is e.g., "auth-service-client"
# This client (auth-service) acts as an OAuth2 client to Keycloak.
spring.security.oauth2.client.registration.keycloak-login.provider=keycloak
spring.security.oauth2.client.registration.keycloak-login.client-id=${OAUTH_CLIENT_ID} # Externalize: e.g., 'auth-service-client' or 'kong-oidc' if it's for Kong
spring.security.oauth2.client.registration.keycloak-login.client-secret=${OAUTH_CLIENT_SECRET} # Externalize this!
spring.security.oauth2.client.registration.keycloak-login.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak-login.redirect-uri=${OAUTH_REDIRECT_URI:https://gotogetheruom.duckdns.org/login/oauth2/code/keycloak-login} # {baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak-login.scope=openid,profile,email,roles # Request 'roles' scope if available and needed
spring.security.oauth2.client.registration.keycloak-login.client-name=KeycloakLogin

# Keycloak Admin Client settings (if auth-service needs to interact with Keycloak Admin API directly - not typical for basic login)
# keycloak.realm=kong
# keycloak.auth-server-url=${KEYCLOAK_ISSUER_URI}/../.. # Typically KEYCLOAK_BASE_URL
# keycloak.ssl-required=external
# keycloak.resource=${KEYCLOAK_ADMIN_CLIENT_ID} # Client ID for Keycloak Admin API access
# keycloak.credentials.secret=${KEYCLOAK_ADMIN_CLIENT_SECRET} # Secret for that client
# keycloak.use-resource-role-mappings=true

# gRPC Server Configuration for auth-service
grpc.server.port=${GRPC_SERVER_PORT:9091} # Define a port for auth-service gRPC, e.g. 9091

# gRPC Client Configuration (auth-service calling user-service)
# The name "user-service" must match @GrpcClient("user-service") in UserProfileCreationService.java
grpc.client.user-service.address=static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9092} # Default to localhost:9092 if not set
grpc.client.user-service.negotiation-type=plaintext # Use 'tls' in production with proper certs
# grpc.client.user-service.enableKeepAlive=true
# grpc.client.user-service.keepAliveTime=60s
# grpc.client.user-service.keepAliveTimeout=20s


# Server port for Spring MVC (REST controllers)
server.port=${APP_PORT:8081} # Define a port for auth-service REST, e.g. 8081

# JWT Settings for locally issued tokens
app.jwt.secret=${JWT_SECRET:PleaseChangeThisDefaultSecretKeyForProductionEnvironment} # MUST be a strong, unique secret in production, at least 256 bits (32 URL-safe chars)
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000} # 1 hour
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000} # 24 hours
