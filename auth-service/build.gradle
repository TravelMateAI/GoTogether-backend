plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.google.protobuf' version '0.9.2'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // Removed again
    implementation 'org.springframework.boot:spring-boot-starter-mail' // Keep if auth-service sends emails
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    // runtimeOnly 'org.postgresql:postgresql' // Removed again
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-security' // Ensure core security is present
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server' // For validating tokens if Authservice exposes secured gRPC
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // Webflux for reactive OAuth2 client or gRPC

    // JWT Library for local token generation/validation
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // Or jjwt-gson if you prefer Gson

    // Core gRPC dependencies
    implementation "io.grpc:grpc-protobuf:1.52.1"
    implementation "io.grpc:grpc-stub:1.52.1"
    runtimeOnly "io.grpc:grpc-netty-shaded:1.52.1"

    // gRPC Spring Boot Starter (includes server and client)
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'

    // Annotation for gRPC services (javax.annotation-api or jakarta.annotation-api)
    // Spring Boot 3 uses Jakarta EE 9+, so jakarta.annotation-api
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    // tomcat annotations-api was likely for older javax.annotation, not needed if using jakarta

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    // testImplementation 'org.springframework.boot:spring-boot-starter-test' // Already included by default usually
}



test {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.21.7"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.52.1'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}



tasks.named('test') {
    useJUnitPlatform()
}