x-kong-env: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_DATABASE: kong
  KONG_PG_HOST: kong-database
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong

volumes:
  kong_data: {}
  kong_prefix_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_tmp_vol:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  keycloak_data: {}

networks:
  kong-net:
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  kong-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "kong", "-U", "kong"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  kong-migrations:
    image: kong:3.5
    command: kong migrations bootstrap
    environment:
      <<: *kong-env
    networks:
      - kong-net
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    image: kong:3.5
    user: kong
    environment:
      <<: *kong-env
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PREFIX: /var/run/kong
      KONG_TRACING_INSTRUMENTATIONS: request
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    networks:
      - kong-net
    restart: on-failure
    read_only: true
    volumes:
      - kong_prefix_vol:/var/run/kong
      - kong_tmp_vol:/tmp
    security_opt:
      - no-new-privileges
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully

  auth-service:
    build:
      context: .
      dockerfile: ../auth-service/Dockerfile.keycloak
    command:
      - start-dev
      - --http-enabled=true
      - --http-host=0.0.0.0
      - --hostname-strict=false
      - --hostname-strict-https=false
      # - --hostname=auth-service
      # - --http-port=8080
      - --hostname=gotogetheruom.duckdns.org
      - --http-port=8084
      - --https-port=8443
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=10"
      KC_DB_USERNAME: postgres.ucutsnncgapnsylikrxk
      KC_DB_PASSWORD: Postgres@2025
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # KC_HOSTNAME_URL: http://localhost:8084
      # KC_HOSTNAME_URL: http://auth-service:8080
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/fullchain.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/privkey.pem
      KC_HOSTNAME_URL: https://gotogetheruom.duckdns.org:8446
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/kong-realm.json
    volumes:
      - ../auth-service/keycloak-import:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
      - /etc/letsencrypt/archive/gotogetheruom.duckdns.org/fullchain1.pem:/opt/keycloak/certs/fullchain.pem:ro
      - /etc/letsencrypt/archive/gotogetheruom.duckdns.org/privkey1.pem:/opt/keycloak/certs/privkey.pem:ro
    networks:
      - kong-net
    ports:
      - "8084:8080"
      - "8446:8443"

  planning-service:
    build:
      context: ../planning-service
      dockerfile: ../deploy/Dockerfile.springboot
    ports:
      - "8086:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - kong-net

  social-media-service:
    build:
      context: ../social-media-service
      # dockerfile:  ../social-media-service/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../social-media-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - kong-net
    depends_on:
      - auth-service
      # auth-service:
      #   condition: service_healthy
    command: >
      sh -c "
      echo 'Waiting for Keycloak to be ready...' &&
      until curl -sSf http://auth-service:8080/realms/kong/.well-known/openid-configuration; do
        echo 'Waiting for realm kong...';
        sleep 5;
      done &&
      #   until curl -sSf -k https://gotogetheruom.duckdns.org:8446/realms/kong/.well-known/openid-configuration; do
      #   echo 'Waiting for realm kong...';
      #   sleep 5;
      # done &&
      echo 'Keycloak realm is ready. Starting app...' &&
      java -jar /app/social-media-service.jar
      "

  api-service:
    build:
      context: ../api-service
      dockerfile: Dockerfile
    ports:
      - "8083:8000"
      - "50051:50051"
    env_file:
      - ../api-service/.env
    environment:
      - GIN_MODE=release
    networks:
      - kong-net
