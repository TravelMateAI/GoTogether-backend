x-kong-config: &kong-env
  KONG_DATABASE: ${KONG_DATABASE:-postgres}
  KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
  KONG_PG_HOST: kong-database
  KONG_PG_USER: ${KONG_PG_USER:-kong}
  KONG_PG_PASSWORD: mykongpassword

volumes:
  kong_data: {}
  kong_prefix_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  kong-net:
    ipam:
      config:
        - subnet: 172.1.1.0/24

services:
  # Services from api-gateway/docker-compose.yml
  kong-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KONG_PG_DATABASE:-kong}
      POSTGRES_USER: ${KONG_PG_USER:-kong}
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:-mykongpassword}
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-d",
          "${KONG_PG_DATABASE:-kong}",
          "-U",
          "${KONG_PG_USER:-kong}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  kong-migrations:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile.kong-oidc
    image: custom/kong-oidc:latest # Image name should match what the build produces
    command: kong migrations bootstrap
    environment:
      <<: *kong-env
    networks:
      - kong-net
    depends_on:
      - kong-database
    restart: on-failure

  kong-migrations-up:
    image: kong:3.5 # Standard image, no build needed
    command: /bin/sh -c "kong migrations up && kong migrations finish"
    environment:
      <<: *kong-env
    networks:
      - kong-net
    depends_on:
      - kong-database
    restart: on-failure

  api-gateway: # Renamed from 'kong'
    build:
      context: ../api-gateway
      dockerfile: Dockerfile.kong-oidc
    image: custom/kong-oidc:latest # Image name should match what the build produces
    user: "${KONG_USER:-kong}"
    environment:
      <<: *kong-env
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "${KONG_PROXY_LISTEN:-0.0.0.0:8000, 0.0.0.0:8443 ssl}"
      KONG_ADMIN_LISTEN: "${KONG_ADMIN_LISTEN:-0.0.0.0:8001}"
      KONG_ADMIN_GUI_LISTEN: "${KONG_ADMIN_GUI_LISTEN:-0.0.0.0:8002}"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PREFIX: ${KONG_PREFIX:-/var/run/kong}
      KONG_TRACING_INSTRUMENTATIONS: "request"
      KONG_CONF: /etc/kong/kong.conf
    ports:
      - "${KONG_INBOUND_PROXY_LISTEN:-0.0.0.0}:8000:8000" # api-service also uses 8000, this might need adjustment if KONG_INBOUND_PROXY_LISTEN is not set to a different host IP. For now, keeping as is from source.
      - "${KONG_INBOUND_SSL_PROXY_LISTEN:-0.0.0.0}:8443:8443"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:8002:8002"
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure
    read_only: true
    volumes:
      - kong_prefix_vol:${KONG_PREFIX:-/var/run/kong}
      - kong_tmp_vol:/tmp
    security_opt:
      - no-new-privileges

  # Service from auth-service/docker-compose.yml
  auth-service: # Renamed from 'keycloak'
    build:
      context: ../auth-service # Adjusted context
      dockerfile: Dockerfile.keycloak
    command:
      - start-dev
      - --http-enabled=true
      - --hostname-strict=false
      - --hostname-strict-https=false
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=10"
      KC_DB_USERNAME: postgres.ucutsnncgapnsylikrxk
      KC_DB_PASSWORD: Postgres@2025
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8084 # Adjusted to match the new host port mapping
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/kong-realm.json
    volumes:
      - ../auth-service/keycloak-import:/opt/keycloak/data/import # Adjusted volume path
    networks:
      - kong-net
    ports:
      # Original Keycloak internal HTTP is 8080, HTTPS is 8443.
      # Original mapping was 8081:8080 and 8445:8443
      # planning-service now uses host 8081.
      # Let's map auth-service to host 8084 (for HTTP) and 8446 (for HTTPS)
      - "8084:8080"
      - "8446:8443"
    restart: unless-stopped

  # Existing services from deploy/docker-compose.yml, now with kong-net
  planning-service:
    build:
      context: ../planning-service
      dockerfile: ../deploy/Dockerfile.springboot
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - kong-net

  social-media-service:
    build:
      context: ../social-media-service
      dockerfile: ../deploy/Dockerfile.springboot
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - kong-net

  api-service:
    build:
      context: ../api-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # This conflicts with api-gateway's 8000:8000. Kong should be the entry point.
        # I will change api-service to map to a different host port, e.g. 8083 (as it was before)
        # and its internal port 8000 will be accessible within kong-net.
      - "8083:8000" # Host:Container
      - "50051:50051"
    environment:
      - GIN_MODE=release
    networks:
      - kong-net
