syntax = "proto3";

package proto;

option go_package = "api-service/proto_generated_go"; // Adjust with actual repo path later
option java_package = "com.example.planning.grpc"; // Adjust with actual Java package later
option java_multiple_files = true;

// The greeter service definition.
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}
