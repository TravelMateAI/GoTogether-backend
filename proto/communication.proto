syntax = "proto3";

package apiservice_proto; // Changed package name

option go_package = "api-service/grpc/pb"; // This will be replaced by the script
option java_package = "com.example.planning.grpc.apiservice"; // Changed java package
option java_multiple_files = true;

// The example greeter service definition.
service ExampleGreeter { // Renamed service
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}

// Add new service definitions below this line in subsequent steps.

//================-------------------------------------------------------------
// Maps Service
//================-------------------------------------------------------------

service Maps {
  rpc Geocode(GeocodeRequest) returns (GeocodeResponse);
  rpc SearchPlaces(SearchPlacesRequest) returns (SearchPlacesResponse);
  rpc GetPlaceDetails(PlaceDetailsRequest) returns (PlaceDetailsResponse);
  rpc GetDirections(DirectionsRequest) returns (DirectionsResponse);
  rpc GetDistanceMatrix(DistanceMatrixRequest) returns (DistanceMatrixResponse);
}

// --- Geocoding ---

message GeocodeRequest {
  string address = 1;
}

message GeocodeResponse {
  message Location {
    double lat = 1;
    double lng = 2;
  }
  message Result {
    string formatted_address = 1;
    Location location = 2;
    // Add other relevant fields from Geocoding API if needed
  }
  repeated Result results = 1;
  string status = 2; // e.g., "OK", "ZERO_RESULTS"
}

// --- Places Search ---

message SearchPlacesRequest {
  string query = 1;     // Text string to search for
  string location = 2;  // Lat,Lng coordinates (e.g., "37.4224764,-122.0842499")
}

message Place {
  message Location {
    double lat = 1;
    double lng = 2;
  }
  message OpeningHours {
    bool open_now = 1;
  }
  message Photo {
    string photo_reference = 1;
    int32 height = 2;
    int32 width = 3;
    // repeated string html_attributions = 4; // Usually not needed for direct display
  }

  string place_id = 1;
  string name = 2;
  string vicinity = 3; // Or address
  double rating = 4;
  int32 user_ratings_total = 5;
  Location geometry_location = 6; // Simplified, directly embedding Location
  OpeningHours opening_hours = 7;
  repeated Photo photos = 8;
  repeated string photo_urls = 9; // New field from existing API
  repeated string types = 10;
}

message SearchPlacesResponse {
  repeated Place results = 1;
  string status = 2; // e.g., "OK", "ZERO_RESULTS"
}

// --- Place Details ---

message PlaceDetailsRequest {
  string place_id = 1;
}

// Using the existing Place message for the main result, but we need a wrapper for the "result" field and status.
message PlaceDetailsResponse {
  Place result = 1; // Contains most of the details
  string status = 2; // e.g., "OK", "NOT_FOUND"
  // Add other fields from Place Details API if specifically needed, like reviews, website etc.
  // For simplicity, we are reusing the 'Place' message. If more detailed fields from
  // Place Details (like reviews, opening_hours.periods, website) are crucial for the client,
  // the 'Place' message might need to be expanded or a more specific 'PlaceDetailResult' message created.
  // For now, let's assume 'Place' is sufficient.
  // Consider adding:
  // repeated Review reviews = 3;
  // string formatted_phone_number = 4;
  // string international_phone_number = 5;
  // string website = 6;
  // OpeningHoursDetail opening_hours_detail = 7; // More detailed than Place.OpeningHours
}

// --- Directions ---

message DirectionsRequest {
  string origin = 1;
  string destination = 2;
}

message DirectionsResponse {
  message Distance {
    string text = 1;
    int32 value = 2; // meters
  }
  message Duration {
    string text = 1;
    int32 value = 2; // seconds
  }
  message Polyline {
    string points = 1;
  }
  message Step {
    string html_instructions = 1;
    Distance distance = 2;
    Duration duration = 3;
    Polyline polyline = 4;
    // Add start_location, end_location if needed
  }
  message Leg {
    Distance distance = 1;
    Duration duration = 2;
    string start_address = 3;
    string end_address = 4;
    repeated Step steps = 5;
    // Add start_location, end_location if needed
  }
  message Route {
    string summary = 1;
    repeated Leg legs = 2;
    Polyline overview_polyline = 3;
    // Add warnings, bounds if needed
  }
  message GeocodedWaypoint {
    string geocoder_status = 1;
    string place_id = 2;
    repeated string types = 3;
  }

  repeated Route routes = 1;
  repeated GeocodedWaypoint geocoded_waypoints = 2;
  string status = 3; // e.g., "OK", "NOT_FOUND"
}

// --- Distance Matrix ---

message DistanceMatrixRequest {
  string origins = 1;      // Pipe-separated
  string destinations = 2; // Pipe-separated
}

message DistanceMatrixResponse {
  // Based on Google's API: origin_addresses and destination_addresses are top-level
  repeated string origin_addresses = 1;
  repeated string destination_addresses = 2;

  message Element {
    message Duration {
      string text = 1;
      int32 value = 2; // seconds
    }
    message Distance {
      string text = 1;
      int32 value = 2; // meters
    }
    string status = 1; // e.g., "OK", "NOT_FOUND", "ZERO_RESULTS"
    Duration duration = 2;
    Distance distance = 3;
  }
  message Row {
    repeated Element elements = 1;
  }
  repeated Row rows = 3;
  string status = 4; // Overall status for the request, not explicitly in current Go model but good to have.
}

//================-------------------------------------------------------------
// Gemini Service
//================-------------------------------------------------------------

service Gemini {
  rpc GenerateContent(GeminiRequest) returns (GeminiResponse);
}

message GeminiRequest {
  string prompt = 1;
}

message GeminiResponse {
  message SafetyRating {
    string category = 1; // e.g., "HARM_CATEGORY_SEXUALLY_EXPLICIT"
    string probability = 2; // e.g., "NEGLIGIBLE", "LOW", "MEDIUM", "HIGH"
  }

  message ContentPart {
    string text = 1;
    // Potentially add other part types like 'inline_data' if needed in the future
  }

  message Content {
    repeated ContentPart parts = 1;
    string role = 2; // e.g., "user", "model"
  }

  message Candidate {
    Content content = 1;
    string finish_reason = 2; // e.g., "STOP", "MAX_TOKENS", "SAFETY"
    int32 index = 3;
    repeated SafetyRating safety_ratings = 4;
    // Potentially add 'citation_metadata' if needed
  }

  message PromptFeedback {
    // string block_reason = 1; // If prompt was blocked
    repeated SafetyRating safety_ratings = 2;
  }

  repeated Candidate candidates = 1;
  PromptFeedback prompt_feedback = 2;
  // UsageMetadata usage_metadata = 3; // If token count, etc., is needed
}
