# Spring Security OAuth2 Client Configuration
# Assuming 'keycloak' is the registration ID for your Keycloak provider
# and Google is an identity provider within that Keycloak realm.

# Provider details for Keycloak itself (acting as the OIDC provider to your app)
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8084/realms/kong
# spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username # Adjust if needed based on Keycloak token claims

# Client registration details for your application registered in Keycloak
spring.security.oauth2.client.registration.google.provider=keycloak
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=${baseUrl}/login/oauth2/code/${registrationId}
# spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google # Or be explicit if {baseUrl} is not set up
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# The client-name is what might appear on a default login page if Spring generates one.
spring.security.oauth2.client.registration.google.client-name=Google

# Note: The 'client-id' and 'client-secret' here are for the 'social-media-service' client registration within Keycloak,
# NOT the Google client ID/secret directly, unless you are bypassing Keycloak for direct Google OAuth,
# which is not the current plan (plan is Keycloak federating Google).
# The Keycloak instance itself is configured with the Google client ID/secret.
# The `registration.google` here tells Spring how to initiate the login flow via Keycloak,
# which then redirects to Google. The `provider=keycloak` links this registration to use Keycloak's OIDC config.
# The name 'google' for the registrationId is conventional for triggering Google login via Keycloak.
