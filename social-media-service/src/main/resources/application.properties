# spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username # Adjust if needed based on Keycloak token claims

# Client registration details for your application registered in Keycloak
spring.security.oauth2.client.registration.google.provider=keycloak
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
