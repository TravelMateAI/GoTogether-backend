name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - dev_oracle

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      REPO_NAME: ${{ github.repository }}
      API_ENV_CONTENT: ${{ secrets.API_ENV_CONTENT }}
      SOCIAL_ENV_CONTENT: ${{ secrets.SOCIAL_ENV_CONTENT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Deploy to Oracle Cloud Instance
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $OCI_USERNAME@$OCI_HOST <<EOF
            set -e

            echo "🔄 Updating packages..."
            sudo dnf update -y

            echo "🐳 Starting Docker if not running..."
            sudo systemctl start docker || true
            sudo systemctl enable docker || true

            echo "🧹 Setting up app directory..."
            APP_DIR="/home/$OCI_USERNAME/app"
            sudo rm -rf "\$APP_DIR"
            mkdir -p "\$APP_DIR"
            cd "\$APP_DIR"

            echo "📥 Cloning latest code..."
            git clone --branch dev_oracle https://github.com/$REPO_NAME.git .

            echo "🔍 Printing API_ENV_CONTENT before writing..."
            echo "$API_ENV_CONTENT"

            echo "🔍 Printing SOCIAL_ENV_CONTENT before writing..."
            echo "$SOCIAL_ENV_CONTENT"

            echo "📝 Writing .env files..."
            printf "%s\n" "$API_ENV_CONTENT" > ./api-service/.env
            printf "%s\n" "$SOCIAL_ENV_CONTENT" > ./social-media-service/.env

            echo "📂 Checking if .env files exist..."
            ls -l ./api-service/.env || echo "❌ .env for API not found"
            ls -l ./social-media-service/.env || echo "❌ .env for Social Media not found"
            ls 

            echo "📦 Verifying written .env for api-service..."
            cat ./api-service/.env

            echo "📦 Verifying written .env for social-media-service..."
            cat ./social-media-service/.env

            echo "🧹 Stopping any running containers..."
            docker-compose -f deploy/docker-compose.yml down || true

            echo "🚀 Running deploy script..."
            chmod +x ./deploy.sh
            ./deploy.sh --up

            echo "🧼 Cleaning up Docker..."
            docker system prune -f || true
          EOF
