# .github/workflows/deploy.yml
name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - dev_oracle # Trigger on dev2 branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Deploy to Oracle Cloud Instance
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }} # usually "opc"
          REPO_NAME: ${{ github.repository }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $OCI_USERNAME@$OCI_HOST <<EOF
            set -e

            sudo dnf update -y

            # Start Docker (if used)
            sudo systemctl start docker || true
            sudo systemctl enable docker || true

            APP_DIR="/home/$OCI_USERNAME/app"
            mkdir -p "\$APP_DIR"
            cd "\$APP_DIR"

            if [ ! -d ".git" ]; then
              echo "Cloning repository for first time..."
              git clone --branch dev_oracle https://github.com/$REPO_NAME.git .
            else
              echo "Pulling latest code from dev2 branch..."
              git pull origin dev2 || {
                echo "Error pulling code, retrying with fresh clone..."
                rm -rf .git
                git init
                git remote add origin https://github.com/$REPO_NAME.git
                git fetch origin dev2
                git checkout -b dev2 origin/dev2 || exit 1
              }
            fi

            echo "Stopping existing containers..."
            docker-compose -f deploy/docker-compose.yml down || true

            echo "Running deploy script..."
            chmod +x ./deploy.sh
            ./deploy.sh --up

            echo "Cleaning up unused Docker resources..."
            docker system prune -f || true
          EOF
