# .github/workflows/deploy.yml
name: Deploy to AWS EC2

on:
  push:
    branches:
      - dev2 # This workflow runs when changes are pushed to the 'deploy' branch

jobs:
  deploy:
    runs-on: ubuntu-latest # The type of runner that the job will run on

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Action to check out your repository code

      - name: Configure SSH
        run: |
          # Create the .ssh directory if it doesn't exist
          mkdir -p ~/.ssh
          # Add the EC2 SSH private key from GitHub Secrets
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          # Set correct permissions for the private key
          chmod 600 ~/.ssh/id_rsa
          # Disable strict host key checking to avoid issues with new hosts (for testing, consider adding known_hosts in production)
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          REPO_NAME: ${{ github.repository }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $EC2_USERNAME@$EC2_HOST <<EOF
            set -e  # Stop script on first error
            
            # Update & install Git if not present
            sudo yum update -y
            

            # Start Docker if not running
            sudo systemctl start docker
            sudo systemctl enable docker

            APP_DIR="/home/$EC2_USERNAME/app"
            mkdir -p "\$APP_DIR"
            cd "\$APP_DIR"

            if [ ! -d ".git" ]; then
              echo "Cloning repository for first time..."
              git clone --branch dev2 https://github.com/$REPO_NAME.git .
            else
              echo "Pulling latest code from dev2 branch..."
              git pull origin dev2 || {
                echo "Error pulling code, retrying with fresh clone..."
                rm -rf .git
                git init
                git remote add origin https://github.com/$REPO_NAME.git
                git fetch origin dev2
                git checkout -b dev2 origin/dev2 || { echo "Fatal: Could not get latest code."; exit 1; }
              }
            fi


            echo "Stopping running Docker containers..."
            docker-compose -f deploy/docker-compose.yml down || true

            echo "Running deployment script..."
            chmod +x ./deploy.sh
            ./deploy.sh --up

            echo "Pruning unused Docker resources..."
            docker system prune -f
          EOF
